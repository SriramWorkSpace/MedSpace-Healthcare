name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: medspace
          POSTGRES_PASSWORD: medspace
          POSTGRES_DB: medspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medspace"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://medspace:medspace@localhost:5432/medspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Extraction evaluation (regression gate + held-out stress set)
        run: |
          python -m app.eval --check --out eval-report
          python -m app.eval --stress --check --out eval-report-stress
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-eval
          path: |
            backend/eval-report/
            backend/eval-report-stress/

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: medspace
          POSTGRES_PASSWORD: medspace
          POSTGRES_DB: medspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medspace"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://medspace:medspace@localhost:5432/medspace
      QUEUE_MODE: inline
      STORAGE_PROVIDER: local
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: hash
      GOOGLE_PROVIDER: fake
      FRONTEND_URL: http://localhost:4173
      RATE_LIMIT_ENABLED: "false"
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and serve web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 4173 > ../web.log 2>&1 &
          npx --yes wait-on -t 90000 http-get://localhost:8000/api/health http-get://localhost:4173
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: tail -n 200 api.log web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medspace-api ./backend
      - run: docker build -t medspace-web --target prod ./frontend
