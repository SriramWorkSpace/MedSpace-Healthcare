<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="MedSpace turns prescriptions and medical documents into structured records, reminders and answers you can trace to the source."
    />
    <meta name="theme-color" content="#f6f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a17" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/png"
      href="/brand/logo-mark-64.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/brand/logo-mark-64-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MedSpace · Your health, all in one space</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("ms-theme");
          var dark =
            t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        animation: boot-in 240ms ease-out 300ms forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation-duration: 1ms;
        }
      }
      :root[data-theme="dark"] .boot img {
        content: url("/brand/logo-mark-64-dark.png");
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown only on slow loads (fades in after 300 ms); React replaces it on first render. -->
      <div class="boot" aria-hidden="true">
        <img src="/brand/logo-mark-64.png" width="44" height="44" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
