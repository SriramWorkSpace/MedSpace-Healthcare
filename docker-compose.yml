name: medspace

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://medspace:medspace@postgres:5432/medspace
    REDIS_URL: redis://redis:6379/0
    QUEUE_MODE: arq
    STORAGE_PROVIDER: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: medspace
    S3_SECRET_KEY: medspace-secret
    HF_HOME: /cache/hf
    FASTEMBED_CACHE_PATH: /cache/fastembed

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: medspace
      POSTGRES_PASSWORD: medspace
      POSTGRES_DB: medspace
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medspace"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medspace
      MINIO_ROOT_PASSWORD: medspace-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 medspace medspace-secret &&
                  mc mb --ignore-existing local/medspace-documents && echo bucket ready"

  api:
    build: { context: ./backend }
    <<: *backend-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - modelcache:/cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ./backend }
    <<: *backend-env
    command: arq app.worker.WorkerSettings --watch app
    volumes:
      - ./backend:/app
      - modelcache:/cache
    depends_on:
      api: { condition: service_started }

  web:
    build: { context: ./frontend }
    environment:
      VITE_API_PROXY: http://api:8000
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  modelcache:
