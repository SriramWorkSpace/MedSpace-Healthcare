name: medspace

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://medspace:medspace@postgres:5432/medspace
    REDIS_URL: redis://redis:6379/0
    QUEUE_MODE: arq
    EMBEDDING_PROVIDER: fastembed
    STORAGE_PROVIDER: s3
    S3_ENDPOINT_URL: http://s3:8333
    S3_ACCESS_KEY: medspace
    S3_SECRET_KEY: medspace-secret
    HF_HOME: /cache/hf
    FASTEMBED_CACHE_PATH: /cache/fastembed
    # Rate limits share Redis across api processes; the Vite proxy forwards the browser's IP.
    RATE_LIMIT_BACKEND: redis
    TRUSTED_PROXY_HOPS: "1"
    # Local e2e runs create many demo accounts from one machine; never loosen limits in prod.
    RATE_LIMIT_SCALE: "10"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: medspace
      POSTGRES_PASSWORD: medspace
      POSTGRES_DB: medspace
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medspace"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  s3:
    # S3-compatible object storage (SeaweedFS). MinIO no longer publishes community images.
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64 -volume.max=100
    ports: ["8333:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 3s
      retries: 30

  api:
    build: { context: ./backend, args: { EXTRAS: "embeddings,dev" } }
    <<: *backend-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - modelcache:/cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

  worker:
    build: { context: ./backend, args: { EXTRAS: "embeddings,dev" } }
    <<: *backend-env
    command: arq app.worker.WorkerSettings --watch app
    volumes:
      - ./backend:/app
      - modelcache:/cache
    depends_on:
      api: { condition: service_started }

  web:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_USE_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  s3data:
  modelcache:
